<ion-content [fullscreen]="true" class="map-page" [scrollY]="false">
  <div #mapContainer class="map-container"></div>

  <div class="map-chrome" *ngIf="!isNavigating">
    <div class="search-panel">
      <div class="loka-search-bar">
        <img src="assets/icon/Lokapharm-logo.png" alt="Lokapharm" class="search-logo" />
        <input
          type="search"
          placeholder="Rechercher une pharmacie, un quartier..."
          [value]="searchQuery"
          (input)="onSearchInput($any($event.target).value)"
        />
        <div class="search-divider"></div>
        <button type="button" class="icon-btn" aria-label="Filtres" (click)="openFilters()">
          <ion-icon name="options-outline"></ion-icon>
        </button>
      </div>

      <div class="filter-chips hide-scrollbar">
        <button
          type="button"
          class="loka-chip"
          [class.active]="mapFilters.onCall"
          (click)="toggleQuickFilter('onCall')"
        >
          <ion-icon *ngIf="mapFilters.onCall" name="checkmark"></ion-icon>
          De garde
        </button>
        <button
          type="button"
          class="loka-chip"
          [class.active]="mapFilters.open24h"
          (click)="toggleQuickFilter('open24h')"
        >
          Ouvert 24/7
        </button>
        <button
          type="button"
          class="loka-chip"
          [class.active]="mapFilters.maxDistanceKm === 5"
          (click)="toggleQuickFilter('near5')"
        >
          &lt; 5 km
        </button>
      </div>
    </div>

    <button
      type="button"
      class="locate-fab"
      [style.bottom]="fabBottomOffset"
      (click)="recenterOnUser()"
      aria-label="Recentrer sur ma position"
    >
      <ion-icon name="locate"></ion-icon>
    </button>
  </div>

  <!-- Mini bottom sheet Stitch (sélection pharmacie) -->
  <div class="selection-sheet" *ngIf="activePharmacy && !isNavigating" role="dialog" aria-label="Pharmacie sélectionnée">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body">
      <div class="sheet-top">
        <button type="button" class="sheet-title-btn" (click)="openPharmacyDetail()">
          <h2>{{ activePharmacy.name }}</h2>
          <p>
            <ion-icon name="navigate-outline"></ion-icon>
            <span *ngIf="activePharmacy.distanceMeters != null; else distFallback">
              {{ activePharmacy.distanceMeters | distance }}
              <ng-container *ngIf="activePharmacy.durationSeconds != null">
                · {{ activePharmacy.durationSeconds | duration }}
              </ng-container>
            </span>
            <ng-template #distFallback>Voir le détail</ng-template>
          </p>
        </button>

        <div class="status-badge" *ngIf="activePharmacy.isOnCall">
          <ion-icon name="medkit"></ion-icon>
          De Garde
        </div>
        <div class="status-badge status-badge--open" *ngIf="!activePharmacy.isOnCall && activePharmacy.isOpenNow">
          Ouvert
        </div>
      </div>

      <div class="sheet-actions">
        <button
          type="button"
          class="loka-btn-primary go-btn"
          [disabled]="routeLoading"
          (click)="openRoutePreview()"
        >
          <ion-icon name="navigate"></ion-icon>
          {{ routeLoading ? 'Calcul…' : 'Y aller' }}
        </button>
        <button
          type="button"
          class="call-btn"
          [disabled]="!activePharmacy.phone"
          (click)="callPharmacy(activePharmacy.phone!)"
          aria-label="Appeler"
        >
          <ion-icon name="call"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <app-filters-sheet
    [open]="filtersOpen"
    [value]="mapFilters"
    (closed)="closeFilters()"
    (applied)="applyMapFilters($event)"
  ></app-filters-sheet>
</ion-content>
