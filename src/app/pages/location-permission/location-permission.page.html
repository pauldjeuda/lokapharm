<div class="perm-page">
  <div class="perm-card">
    <div class="logo-circle">
      <img src="assets/icon/Lokapharm-logo.png" alt="LokaPharm" />
    </div>
    <h1>Pourquoi nous avons besoin de votre position</h1>
    <p>
      Pour vous montrer les pharmacies de garde et les plus proches en temps réel,
      LokaPharm a besoin d’accéder à votre localisation. Vos données restent sur
      votre appareil et ne sont jamais partagées.
    </p>
    <button type="button" class="loka-btn-primary full" [disabled]="loading" (click)="enable()">
      <ion-icon name="locate"></ion-icon>
      {{ loading ? 'Activation…' : 'Activer la localisation' }}
    </button>
    <button type="button" class="link-btn" (click)="skip()">Continuer sans localisation</button>
  </div>
</div>
